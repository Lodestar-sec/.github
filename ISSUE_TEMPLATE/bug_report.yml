name: Bug report
description: Something is not working as documented.
title: "bug: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** Use the repository's Security tab → Report a vulnerability.
  - type: input
    id: version
    attributes:
      label: Version
      description: Product version, image tag, or commit SHA.
      placeholder: v1.2.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config, or commands. Redact secrets and internal hostnames.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, CI platform, Kubernetes version — whatever is relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs here. They are rendered as code automatically.
      render: shell
